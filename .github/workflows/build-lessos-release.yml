name: Build LessOS Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'  # YYYYMMDD format
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'lessui-hq/LessOS'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: [RK3566, SM8250]
    env:
      DISTRO: LessOS
      PROJECT: ROCKNIX
      DEVICE: ${{ matrix.device }}
      ARCH: aarch64
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Maximize build space
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 4096
          swap-size-mb: 4096
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/rocknix-build:latest .

      - name: Build LessOS
        run: |
          make docker-LessOS-${{ matrix.device }}

      - name: Get tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=$(date +'%Y%m%d')-dev" >> $GITHUB_OUTPUT
          fi

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: LessOS-${{ matrix.device }}-${{ steps.tag.outputs.TAG }}
          path: |
            target/LessOS-*.img.gz
            target/LessOS-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Upload update artifact
        uses: actions/upload-artifact@v4
        with:
          name: LessOS-update-${{ matrix.device }}-${{ steps.tag.outputs.TAG }}
          path: |
            target/LessOS-*.tar
            target/LessOS-*.tar.sha256
          compression-level: 0
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LessOS-*
          merge-multiple: true

      - name: Get tag info
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^[0-9]{8}$' | sed -n '2p' || echo "")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "${{ steps.tag.outputs.PREV_TAG }}" ]; then
            CHANGELOG=$(git log --format="- %s" ${{ steps.tag.outputs.PREV_TAG }}..${{ steps.tag.outputs.TAG }} | grep -v "Merge pull request" | head -50)
          else
            CHANGELOG="Initial release"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.TAG }}
          name: LessOS ${{ steps.tag.outputs.TAG }}
          artifacts: LessOS-*
          body: |
            ## LessOS ${{ steps.tag.outputs.TAG }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ---
            Built from ROCKNIX upstream.
          draft: false
          prerelease: false
